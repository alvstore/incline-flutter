name: incline_app
description: "Incline - Rise.Reflect.Repeat."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  flutter_riverpod: ^2.6.1
  flutter_3d_controller: ^2.3.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  go_router: ^16.1.0
  url_launcher: ^6.3.0
  flutter_animate: ^4.5.2
  lottie: ^3.3.1
  pdf: ^3.11.3
  printing: ^5.14.3
  path_provider: ^2.1.5
  open_filex: ^5.0.0
  razorpay_flutter: ^1.4.7
  local_auth: ^2.3.0
  image_picker: ^1.2.0
  app_links: ^6.4.1
  flutter_local_notifications: ^19.5.0
  permission_handler: 11.3.1
  mobile_scanner: ^5.2.3
  video_player: ^2.10.0
  flutter_svg: ^2.2.0
  rive: ^0.13.20

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/incline_logo.png
    - assets/avatar_placeholder.jpg
    - assets/images/
    - assets/animations/
    - google_fonts/
